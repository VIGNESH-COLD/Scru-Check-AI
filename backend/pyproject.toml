[project]
name = "omnirag-backend"
version = "0.1.0"
description = "Enterprise RAG & Document Intelligence Platform Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "pgvector>=0.3.5",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "pytesseract>=0.3.10",
    "sentence-transformers>=3.2.0",
    "llama-index-core>=0.11.0",
    "llama-index-vector-stores-postgres>=0.2.0",
    "llama-index-embeddings-huggingface>=0.3.0",
    "llama-index-llms-ollama>=0.3.0",
    "httpx>=0.27.0",
    "ollama>=0.3.3",
    "matplotlib>=3.9.0",
    "pillow>=10.4.0",
    "pyjwt[crypto]>=2.9.0",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.12",
    "email-validator>=2.3.0",
    "reportlab>=5.1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]
pythonpath = ["."]
